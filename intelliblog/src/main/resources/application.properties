server.port=8081

# Optional: put your Gemini key in ./local.properties (git-ignored), see local.properties.example
spring.config.import=optional:file:./local.properties
spring.datasource.url=jdbc:h2:file:./data/intelliblog
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT secret (32+ chars). Override with the JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:change-this-intelliblog-secret-key-to-something-long-123}
app.jwt.expiration-ms=86400000

# Gemini AI (summarize, translate, chatbot). Set GEMINI_API_KEY to enable.
app.gemini.key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-flash-latest}

# image uploads (stored in ./uploads and served at /uploads/**)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Daily news import (public RSS feeds). Format: Category|Source|URL, comma separated. Add or remove feeds freely.
app.news.feeds=World|BBC News|https://feeds.bbci.co.uk/news/world/rss.xml,World|NPR|https://feeds.npr.org/1004/rss.xml,World|Al Jazeera|https://www.aljazeera.com/xml/rss/all.xml,Business|BBC Business|https://feeds.bbci.co.uk/news/business/rss.xml,Science|BBC Science|https://feeds.bbci.co.uk/news/science_and_environment/rss.xml,Technology|BBC Technology|https://feeds.bbci.co.uk/news/technology/rss.xml,Technology|TechCrunch|https://techcrunch.com/feed/,Technology|Ars Technica|https://feeds.arstechnica.com/arstechnica/index,Technology|Wired|https://www.wired.com/feed/rss,India|The Hindu|https://www.thehindu.com/news/national/feeder/default.rss
app.news.per-feed=4
app.news.keep-days=30
app.news.refresh-ms=10800000
